[project]
name = "yogacenterapp"
version = "0.1.0"
description = "A desktop application built with Python for managing yoga centers. This application helps simplify administrative tasks. Resources"
authors = [
    {name = "Angel Altuve"}
]
license = {text = "GPLV3"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel (>=0.0.37,<0.0.38)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyqt6 (>=6.10.2,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-qt (>=4.5.0,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)"
]
